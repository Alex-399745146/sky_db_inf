[project]
name = "sky-db-inf"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.33.1,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "prettytable (>=3.17.0,<4.0.0)"
]

[tool.poetry]
packages = [{include = "sky_db_inf", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=1.20.0,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "types-psycopg2 (>=2.9.21.20260408,<3.0.0.0)",
    "types-requests (>=2.33.0.20260408,<3.0.0.0)"
]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = false
strict = false
warn_unreachable = false
exclude = [".venv", "__pycache__", ".git"]

[[tool.mypy.overrides]]
module = ['tests.*'] # для какого модуля
allow_untyped_defs = true # переопределение настройки

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
line_length = 119
